[package]
name = "trusted-server-geo-51degrees"
description = "51Degrees IP Intelligence geo provider, calling a 51Degrees cloud service over HTTP."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
trusted-server-core = { workspace = true }
# Reads and verifies the OWID envelope a 51Did is carried in. Needed because
# the resolve endpoint accepts a value posted by the browser, and an identifier
# taken on trust could be anyone's, which would link this visitor to another
# person's identity graph row. Pure parsing and signature checking, no HTTP of
# its own, so the caller supplies both the key and the transport.
fodid = "4.5.3"
async-trait = { workspace = true }
edgezero-core = { workspace = true }
error-stack = { workspace = true }
http = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
url = { workspace = true }
validator = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The tests that drive `detect` against a service that cannot be reached need a
# runtime, because that is the one behavior in this crate whose failure is
# silent: reading an outage as a bot stops Edge Cookie issuance for everyone.
tokio = { workspace = true, features = ["rt", "macros"] }

# The visible owner of this vendor crate, the way Prebid.js requires a named
# maintainer of every adapter. This one has a vendor owner from the start,
# because 51Degrees wrote it.
[package.metadata.maintainers]
owner = "51Degrees"
status = "vendor owned"
