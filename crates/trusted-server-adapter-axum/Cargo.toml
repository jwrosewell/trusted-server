[package]
name = "trusted-server-adapter-axum"
description = "Axum entry point for Trusted Server — native dev server."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lints]
workspace = true

[lib]
name = "trusted_server_adapter_axum"
path = "src/lib.rs"

[[bin]]
name = "trusted-server-axum"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
edgezero-adapter-axum = { workspace = true, features = ["axum"] }
edgezero-core = { workspace = true }
error-stack = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
simple_logger = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
trusted-server-core = { workspace = true }
trusted-server-permission-signal-gpc = { workspace = true }
trusted-server-permission-signal-gpp = { workspace = true }
trusted-server-permission-signal-tcf = { workspace = true }
trusted-server-permission-signal-us-privacy = { workspace = true }
# The vendor geo and device provider. A real dependency, not a dev one: this
# adapter is the composition root, so a module it does not hand to the registry
# is one no deployment can select, and the selector then fails at startup
# naming a module that is compiled into the binary. Core stays neutral, which
# is the rule, and the adapter composing a vendor is how that rule is kept.
#
# Linking it does not turn it on. Its builder runs only when
# `[integration] provider` names `fiftyone_degrees`.
trusted-server-geo-51degrees = { workspace = true }

[dev-dependencies]
trusted-server-core = { workspace = true, features = ["test-utils"] }
axum = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
temp-env = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { workspace = true, features = ["util"] }
# Test fixture only. It proves the integration seam from outside core and must
# never reach a production build, so it stays a dev-dependency.
trusted-server-integration-seam-probe = { path = "../integrations/seam-probe" }
